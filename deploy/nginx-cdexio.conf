# cdexio.lemacore.com — TLS terminator in front of the dashboard.
#
# The dashboard is the ONLY thing exposed. The bot API on 8790 is bound to
# localhost and is not proxied here: it has no authentication of its own, and
# a location block pointing at it would publish the account's balance,
# positions and full trade history to anyone who guessed the path.

server {
    listen 80;
    listen [::]:80;
    server_name cdexio.lemacore.com;

    # Certbot writes its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` rather than the `http2 on;` directive: this box runs
    # an nginx older than 1.25.1, where the standalone directive does not
    # exist and the whole configuration fails to parse — taking every other
    # site on the machine down with it on the next reload.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdexio.lemacore.com;

    ssl_certificate /etc/letsencrypt/live/cdexio.lemacore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdexio.lemacore.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS. This host will only ever be this dashboard, and a downgrade to
    # plain HTTP would hand the session cookie to anyone on the path.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Not a public site. Search engines indexing a trading dashboard's login
    # page is the cheapest way for somebody to find it at all.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Auth.js builds OAuth callback URLs from this. Without it every
        # redirect comes back as http://127.0.0.1:3100 and Google refuses the
        # callback with a redirect_uri mismatch that names a URL nobody
        # configured.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
